[package]
name = "warm-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pending a release: the index-time tables are on the perf/index-time-tables branch of the engine, pinned by commit. Replace with the exact
# published version and refresh Cargo.lock once it is released.
warm-rust = { git = "https://github.com/writerslogic/warm", rev = "76b722808e5d1385877bdb67e10e66336b3e40f9" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
